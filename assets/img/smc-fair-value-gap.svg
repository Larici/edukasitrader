<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif">
  <rect width="720" height="380" rx="12" fill="#161d27"/>
  <rect x="0.5" y="0.5" width="719" height="379" rx="12" fill="none" stroke="#26303c"/>

  <text x="24" y="34" fill="#e6ebf0" font-size="17" font-weight="700">Fair Value Gap (FVG)</text>

  <line x1="40" y1="300" x2="680" y2="300" stroke="#26303c" stroke-width="1"/>

  <!-- candle 1 -->
  <g>
    <line x1="220" y1="150" x2="220" y2="240" stroke="#3ecf8e" stroke-width="2"/>
    <rect x="205" y="160" width="30" height="70" fill="#3ecf8e"/>
  </g>

  <!-- candle 2: big bullish, creates the gap -->
  <g>
    <line x1="330" y1="60" x2="330" y2="200" stroke="#3ecf8e" stroke-width="2"/>
    <rect x="315" y="75" width="30" height="110" fill="#3ecf8e"/>
  </g>

  <!-- candle 3 -->
  <g>
    <line x1="440" y1="40" x2="440" y2="130" stroke="#3ecf8e" stroke-width="2"/>
    <rect x="425" y="50" width="30" height="60" fill="#3ecf8e"/>
  </g>

  <!-- FVG zone: gap between candle1 high (150) and candle3 low (130) roughly -->
  <rect x="205" y="130" width="280" height="30" fill="#d4af37" fill-opacity="0.18" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="345" y="123" fill="#d4af37" font-size="13" font-weight="700" text-anchor="middle">Fair Value Gap (imbalance)</text>

  <text x="345" y="330" fill="#9aa7b4" font-size="12" text-anchor="middle">Celah harga antara candle 1 dan candle 3</text>
  <text x="345" y="346" fill="#9aa7b4" font-size="12" text-anchor="middle">yang belum "terisi" transaksi dua arah</text>
</svg>
