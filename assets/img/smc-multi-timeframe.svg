<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif">
  <rect width="720" height="420" rx="12" fill="#161d27"/>
  <rect x="0.5" y="0.5" width="719" height="419" rx="12" fill="none" stroke="#26303c"/>
  <text x="24" y="34" fill="#e6ebf0" font-size="17" font-weight="700">Analisis Multi-Timeframe: HTF Bias → LTF Entry</text>

  <!-- divider -->
  <line x1="360" y1="60" x2="360" y2="390" stroke="#26303c" stroke-width="1"/>

  <!-- LEFT panel: HTF, bigger candles, downtrend bias -->
  <text x="190" y="66" fill="#d4af37" font-size="13" font-weight="700" text-anchor="middle">Timeframe H4 / Daily (Bias)</text>
  <rect x="40" y="80" width="300" height="230" fill="#12181f" rx="8"/>

  <g stroke="#3ecf8e" fill="#3ecf8e">
    <line x1="80" y1="120" x2="80" y2="170"/><rect x="66" y="130" width="28" height="30"/>
  </g>
  <g stroke="#ff5c5c" fill="#ff5c5c">
    <line x1="140" y1="110" x2="140" y2="190"/><rect x="126" y="125" width="28" height="50"/>
  </g>
  <g stroke="#ff5c5c" fill="#ff5c5c">
    <line x1="200" y1="150" x2="200" y2="240"/><rect x="186" y="165" width="28" height="55"/>
  </g>
  <g stroke="#ff5c5c" fill="#ff5c5c">
    <line x1="260" y1="200" x2="260" y2="280"/><rect x="246" y="215" width="28" height="50"/>
  </g>

  <rect x="240" y="215" width="80" height="65" fill="#d4af37" fill-opacity="0.14" stroke="#d4af37" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="190" y="300" fill="#9aa7b4" font-size="12" text-anchor="middle">Bias: Downtrend</text>
  <text x="190" y="316" fill="#9aa7b4" font-size="12" text-anchor="middle">Cari area order block/FVG</text>

  <!-- arrow connecting panels -->
  <path d="M 340 200 L 380 200" stroke="#e6ebf0" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#e6ebf0"/>
    </marker>
  </defs>

  <!-- RIGHT panel: LTF, zoomed candles inside the marked zone -->
  <text x="540" y="66" fill="#d4af37" font-size="13" font-weight="700" text-anchor="middle">Timeframe M15 (Entry)</text>
  <rect x="390" y="80" width="300" height="230" fill="#12181f" rx="8"/>

  <g stroke="#ff5c5c" fill="#ff5c5c">
    <line x1="430" y1="120" x2="430" y2="160"/><rect x="418" y="130" width="24" height="25"/>
  </g>
  <g stroke="#ff5c5c" fill="#ff5c5c">
    <line x1="480" y1="140" x2="480" y2="190"/><rect x="468" y="150" width="24" height="30"/>
  </g>
  <g stroke="#3ecf8e" fill="#3ecf8e">
    <line x1="530" y1="170" x2="530" y2="220"/><rect x="518" y="180" width="24" height="30"/>
  </g>
  <g stroke="#3ecf8e" fill="#3ecf8e">
    <line x1="580" y1="130" x2="580" y2="200"/><rect x="568" y="145" width="24" height="45"/>
  </g>
  <g stroke="#3ecf8e" fill="#3ecf8e">
    <line x1="630" y1="90" x2="630" y2="160"/><rect x="618" y="105" width="24" height="45"/>
  </g>

  <circle cx="530" cy="195" r="6" fill="none" stroke="#d4af37" stroke-width="2.5"/>
  <text x="540" y="300" fill="#9aa7b4" font-size="12" text-anchor="middle">CHoCH + entry sell</text>
  <text x="540" y="316" fill="#9aa7b4" font-size="12" text-anchor="middle">di zona OB/FVG H4</text>

  <text x="360" y="405" fill="#9aa7b4" font-size="12" text-anchor="middle">Bias ditentukan dari timeframe besar, konfirmasi &amp; entry presisi dicari di timeframe kecil.</text>
</svg>
