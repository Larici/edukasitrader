<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif">
  <rect width="720" height="380" rx="12" fill="#161d27"/>
  <rect x="0.5" y="0.5" width="719" height="379" rx="12" fill="none" stroke="#26303c"/>

  <text x="24" y="34" fill="#e6ebf0" font-size="17" font-weight="700">Market Structure: Uptrend → Downtrend</text>

  <!-- price line -->
  <polyline points="50,260 150,110 250,170 350,70 450,130 550,105 650,210"
            fill="none" stroke="#d4af37" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- swing points -->
  <circle cx="50" cy="260" r="5" fill="#9aa7b4"/>
  <circle cx="150" cy="110" r="5" fill="#3ecf8e"/>
  <circle cx="250" cy="170" r="5" fill="#3ecf8e"/>
  <circle cx="350" cy="70" r="5" fill="#3ecf8e"/>
  <circle cx="450" cy="130" r="5" fill="#3ecf8e"/>
  <circle cx="550" cy="105" r="5" fill="#ff5c5c"/>
  <circle cx="650" cy="210" r="5" fill="#ff5c5c"/>

  <!-- labels -->
  <text x="150" y="95" fill="#3ecf8e" font-size="13" font-weight="700" text-anchor="middle">HH</text>
  <text x="250" y="195" fill="#3ecf8e" font-size="13" font-weight="700" text-anchor="middle">HL</text>
  <text x="350" y="55" fill="#3ecf8e" font-size="13" font-weight="700" text-anchor="middle">HH</text>
  <text x="450" y="155" fill="#3ecf8e" font-size="13" font-weight="700" text-anchor="middle">HL</text>
  <text x="550" y="90" fill="#ff5c5c" font-size="13" font-weight="700" text-anchor="middle">LH</text>
  <text x="650" y="235" fill="#ff5c5c" font-size="13" font-weight="700" text-anchor="middle">LL</text>

  <!-- trend zones -->
  <line x1="150" y1="300" x2="450" y2="300" stroke="#3ecf8e" stroke-width="2"/>
  <text x="300" y="320" fill="#3ecf8e" font-size="13" text-anchor="middle">Struktur Uptrend (HH &amp; HL)</text>

  <line x1="450" y1="345" x2="650" y2="345" stroke="#ff5c5c" stroke-width="2"/>
  <text x="550" y="365" fill="#ff5c5c" font-size="13" text-anchor="middle">Berubah jadi Downtrend (LH &amp; LL)</text>
</svg>
