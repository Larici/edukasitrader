<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif">
  <rect width="720" height="420" rx="12" fill="#161d27"/>
  <rect x="0.5" y="0.5" width="719" height="419" rx="12" fill="none" stroke="#26303c"/>
  <text x="24" y="34" fill="#e6ebf0" font-size="17" font-weight="700">Breaker Block: Order Block yang Ditembus</text>

  <line x1="40" y1="360" x2="680" y2="360" stroke="#26303c" stroke-width="1"/>

  <!-- initial bullish order block candle -->
  <g stroke="#ff5c5c" fill="#ff5c5c">
    <line x1="100" y1="210" x2="100" y2="270"/><rect x="88" y="222" width="24" height="36"/>
  </g>
  <rect x="80" y="215" width="450" height="50" fill="#d4af37" fill-opacity="0.10" stroke="#d4af37" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="90" y="207" fill="#d4af37" font-size="12" font-weight="700">Bullish Order Block (awal)</text>

  <!-- small rally attempt -->
  <g stroke="#3ecf8e" fill="#3ecf8e">
    <line x1="160" y1="150" x2="160" y2="220"/><rect x="148" y="165" width="24" height="45"/>
  </g>
  <g stroke="#ff5c5c" fill="#ff5c5c">
    <line x1="220" y1="170" x2="220" y2="240"/><rect x="208" y="185" width="24" height="45"/>
  </g>

  <!-- strong bearish candle breaking through the OB low -->
  <g stroke="#ff5c5c" fill="#ff5c5c">
    <line x1="290" y1="180" x2="290" y2="320"/><rect x="278" y="200" width="24" height="110"/>
  </g>
  <text x="290" y="340" fill="#ff5c5c" font-size="12" font-weight="700" text-anchor="middle">OB ditembus</text>
  <text x="290" y="356" fill="#ff5c5c" font-size="11" text-anchor="middle">→ jadi Breaker Block</text>

  <!-- continuation down -->
  <g stroke="#ff5c5c" fill="#ff5c5c">
    <line x1="350" y1="270" x2="350" y2="330"/><rect x="338" y="285" width="24" height="35"/>
  </g>

  <!-- pullback retest from below -->
  <path d="M 380 300 C 430 280, 460 240, 480 225" fill="none" stroke="#e6ebf0" stroke-width="2" stroke-dasharray="4,4"/>
  <g stroke="#3ecf8e" fill="#3ecf8e">
    <line x1="500" y1="200" x2="500" y2="250"/><rect x="488" y="215" width="24" height="25"/>
  </g>

  <!-- rejection back down -->
  <g stroke="#ff5c5c" fill="#ff5c5c">
    <line x1="560" y1="220" x2="560" y2="300"/><rect x="548" y="235" width="24" height="45"/>
  </g>
  <g stroke="#ff5c5c" fill="#ff5c5c">
    <line x1="620" y1="260" x2="620" y2="340"/><rect x="608" y="275" width="24" height="45"/>
  </g>

  <text x="500" y="185" fill="#e6ebf0" font-size="12" font-weight="700" text-anchor="middle">Retest dari bawah</text>
  <text x="560" y="325" fill="#9aa7b4" font-size="11" text-anchor="middle">Ditolak (rejection)</text>
  <text x="560" y="340" fill="#9aa7b4" font-size="11" text-anchor="middle">zona kini jadi resistance</text>
</svg>
